# Universo degli strumenti (M1). Per ogni strumento REALE (UCITS/ETP, negoziabile su Trade Republic)
# si indica il PROXY usato per lo storico, perché non esiste una fonte gratuita pulita per i prezzi UCITS
# (docs/01-raccolta/approfondimenti-fase3.md). I proxy USA si convertono in EUR con il cambio BCE.
#
# ISIN: compilati solo quelli certi. Gli altri sono vuoti = DA VERIFICARE prima del live (mai inventarli).
# tax_category: RC = plusvalenze come redditi di capitale (ETF) · RD = redditi diversi (ETC/ETN/azioni)

[[instrument]]
id = "all_world"            # BENCHMARK e core (piano di accumulo)
name = "Vanguard FTSE All-World UCITS ETF (Acc)"
asset_class = "etf_ucits"
isin = "IE00BK5BQT80"
currency = "EUR"
tax_category = "RC"
sleeves = ["core", "benchmark"]
proxy = { source = "alpaca_stock", symbol = "VT", quote_currency = "USD" }

