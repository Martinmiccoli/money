# Produzione sulla VM (M9). Avvio: docker compose -f infra/prod/docker-compose.yml --env-file .env up -d
# Nessuna porta esposta su internet: database e webapp ascoltano solo in locale; l'accesso dai tuoi
# dispositivi passa da Tailscale (`tailscale serve`), oppure da Cloudflare Tunnel (profilo "cloudflare").
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: infra/prod/Dockerfile
    image: money-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../../.env
    environment:
      # dentro la rete di compose il database si chiama "db"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_PORT: "8787"
      HOSTNAME_BIND: "0.0.0.0"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../../reports:/app/reports
      - ../../data:/app/data

  cloudflared:   # facoltativo: solo con un dominio su Cloudflare (costa ~10 €/anno)
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  pgdata:
