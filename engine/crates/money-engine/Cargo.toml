[package]
name = "money-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Motore di esecuzione: guardrails (money-core) → adapter (SimBroker, Alpaca ombra) → ledger"

[dependencies]
money-core = { path = "../money-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["db-postgres"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
